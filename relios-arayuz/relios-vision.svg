<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2736"/>
      <stop offset="1" stop-color="#0B1018"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2EC4D6"/>
      <stop offset="0.5" stop-color="#7FB8A8"/>
      <stop offset="1" stop-color="#F4A62A"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2EC4D6"/>
      <stop offset="1" stop-color="#F4A62A"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDC86F"/>
      <stop offset="1" stop-color="#F4A62A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F4A62A" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#F4A62A" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#F4A62A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="eye">
      <path d="M150 512 C 290 300, 734 300, 874 512 C 734 724, 290 724, 150 512 Z"/>
    </clipPath>
  </defs>
  <rect x="50" y="50" width="924" height="924" rx="200" fill="url(#bg)" stroke="#263445" stroke-width="5"/>
  <!-- eye opening -->
  <path d="M150 512 C 290 300, 734 300, 874 512 C 734 724, 290 724, 150 512 Z" fill="#0E151F"/>
  <g clip-path="url(#eye)">
    <circle cx="512" cy="512" r="250" fill="url(#glow)"/>
    <circle cx="512" cy="512" r="168" fill="none" stroke="url(#iris)" stroke-width="58"/>
    <circle cx="512" cy="512" r="92" fill="url(#sun)"/>
    <circle cx="478" cy="476" r="26" fill="#FFF3D6" fill-opacity="0.85"/>
  </g>
  <!-- eyelid outline -->
  <path d="M150 512 C 290 300, 734 300, 874 512 C 734 724, 290 724, 150 512 Z" fill="none" stroke="url(#lid)" stroke-width="44" stroke-linejoin="round"/>
  <!-- AI sparkle -->
  <path d="M790 170 C 798 222, 818 242, 870 250 C 818 258, 798 278, 790 330 C 782 278, 762 258, 710 250 C 762 242, 782 222, 790 170 Z" fill="#FFD98E"/>
</svg>
